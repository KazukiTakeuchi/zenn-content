title: "ベンチマークを信じるな — AIエージェント評価の実務"
summary: "「SWE-benchで高スコアだから、このエージェントは本番でも大丈夫」——そう判断していませんか。2026年、SWE-bench Verifiedは報告が停止され、GAIAのスコアは飽和しました。公開ベンチマークの数字は、自社エージェントの出荷判断には使えません。本書は、その判断を自社タスクの実測に切り替えるための、評価（Evals）の実務書です。\n【本書で扱うこと】\n・本番の失敗から評価セットを作る手順と、評価ケースの設計\n・最終状態ではなく「軌跡」を採点する方法\n・LLMジャッジの校正——kappa、感度・特異度、スコアの統計的補正\n・CIゲートのしきい値の決め方、本番監視とコスト設計\n・評価ツールの選定マトリクスと、セキュリティ評価（OWASP Agentic Top 10対応）\n【こんな人に読んでほしい】\n・AIエージェントの出荷可否を数字で判断する必要がある人\n・評価を回し始めたが、数字の信じ方が分からない人\n第1章〜第3章（約2万字）は無料公開です。まず無料分を読んで、合わなければ買わなくて大丈夫です。"
topics: ["ai", "llm", "エージェント", "評価", "evals"]
